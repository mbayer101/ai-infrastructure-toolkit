services:
  redis:
    image: redis:7-alpine
    container_name: ai-gateway-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-ai-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - GATEWAY_MASTER_KEY=${GATEWAY_MASTER_KEY:-sk-default-master}
      - REDIS_URL=redis://redis:6379/0
      # Cloud Configuration: Region & provider pointers only (NO hardcoded AWS secret keys)
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      # Forward third-party keys if calling external models directly
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Mount host AWS credentials/config read-only for automatic IAM role resolution
      - ${HOME}/.aws:/home/gateway/.aws:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  redis-data:
    driver: local

